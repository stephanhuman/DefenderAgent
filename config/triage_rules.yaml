# Triage Rules for MS Defender Alerts
# These rules determine how alerts are prioritized and investigated

severity_levels:
  informational: 1
  low: 2
  medium: 3
  high: 4
  critical: 5

# Rule-based triage by alert type and severity
triage_rules:
  # Malware-related alerts
  - alert_type: "Malware"
    severity: ["high", "critical"]
    priority: "critical"
    auto_investigate: true
    investigation_steps:
      - "Check file hash reputation"
      - "Identify affected devices"
      - "Review execution context and parent processes"
      - "Check for lateral movement indicators"
      - "Assess containment requirements"
    kql_queries:
      - "malware_detections"
      - "file_hash_investigation"
      - "alerts_for_device"

  - alert_type: "Malware"
    severity: ["medium", "low"]
    priority: "medium"
    auto_investigate: true
    investigation_steps:
      - "Check file hash reputation"
      - "Identify affected devices"
      - "Review execution context"
    kql_queries:
      - "malware_detections"
      - "file_activity_by_name"

  # Phishing and credential theft
  - alert_type: "Phishing"
    severity: ["high", "critical"]
    priority: "critical"
    auto_investigate: true
    investigation_steps:
      - "Identify targeted users"
      - "Check for credential compromise"
      - "Review email headers and sender reputation"
      - "Assess scope of phishing campaign"
      - "Check for suspicious sign-ins"
    kql_queries:
      - "email_by_sender"
      - "email_with_attachments"
      - "failed_logins"
      - "successful_logins_by_user"

  # Suspicious activity
  - alert_type: "SuspiciousActivity"
    severity: ["critical", "high"]
    priority: "high"
    auto_investigate: true
    investigation_steps:
      - "Analyze user/entity behavior patterns"
      - "Check for privilege escalation"
      - "Review recent account activities"
      - "Identify anomalous behaviors"
    kql_queries:
      - "suspicious_process_activity"
      - "powershell_execution"
      - "registry_modifications"
      - "network_connections"

  # Vulnerability exploitation
  - alert_type: "Exploit"
    severity: ["critical", "high"]
    priority: "critical"
    auto_investigate: true
    investigation_steps:
      - "Identify CVE and patch status"
      - "Check for successful exploitation"
      - "Review affected systems"
      - "Assess blast radius"
      - "Verify mitigation status"
    kql_queries:
      - "suspicious_process_activity"
      - "network_connections"
      - "alerts_for_device"

  # Default rule for unmatched alerts
  - alert_type: "Default"
    severity: ["critical", "high"]
    priority: "high"
    auto_investigate: true
    investigation_steps:
      - "Review alert details"
      - "Assess potential impact"
      - "Identify affected resources"
    kql_queries:
      - "alerts_for_device"

# Investigation templates by priority
investigation_prompts:
  critical: |
    You are a security analyst investigating a CRITICAL security alert.

    Alert Details:
    {alert_details}

    Investigation Steps:
    {investigation_steps}

    {kql_context}

    Provide a thorough investigation report including:
    1. Summary of the threat
    2. Potential impact and risk assessment
    3. Indicators of Compromise (IOCs)
    4. Recommended immediate actions
    5. Recommended containment measures
    6. Long-term remediation steps

    Be specific and actionable in your recommendations.

  high: |
    You are a security analyst investigating a HIGH priority security alert.

    Alert Details:
    {alert_details}

    Investigation Steps:
    {investigation_steps}

    {kql_context}

    Provide an investigation report including:
    1. Summary of the alert
    2. Risk assessment
    3. Key findings
    4. Recommended actions
    5. Remediation steps

  medium: |
    You are a security analyst triaging a MEDIUM priority security alert.

    Alert Details:
    {alert_details}

    {kql_context}

    Provide a triage report including:
    1. Alert summary
    2. Preliminary risk assessment
    3. Whether this requires immediate attention
    4. Suggested next steps

  low: |
    You are a security analyst reviewing a LOW priority security alert.

    Alert Details:
    {alert_details}

    {kql_context}

    Provide a brief assessment including:
    1. Summary
    2. Whether this can be closed or needs follow-up
    3. Any notable observations
