version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defender-agent
    hostname: defender-agent

    environment:
      # Azure DevOps Configuration
      - AZURE_DEVOPS_PAT=${AZURE_DEVOPS_PAT}
      - AZURE_DEVOPS_ORG=${AZURE_DEVOPS_ORG}

      # AI Agent Configuration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-claude-sonnet-4-5-20250929}

      # Git Configuration
      - DEFAULT_BASE_BRANCH=${DEFAULT_BASE_BRANCH:-main}
      - GIT_USER_NAME=${GIT_USER_NAME:-DefenderAgent}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-defender-agent@automation.local}

      # Task Configuration
      - AUTO_CREATE_PR=${AUTO_CREATE_PR:-false}
      - RUN_TESTS=${RUN_TESTS:-true}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      # Workspace for cloned repositories
      - repo-workspace:/workspace/repos

      # Application code
      - ./src:/app/src
      - ./run_task.py:/app/run_task.py

      # Logs
      - ./logs:/app/logs

      # Persist Git credentials
      - git-credentials:/root/.git-credentials

      # Azure CLI configuration
      - azure-config:/root/.azure

    working_dir: /workspace/repos

    # Keep container running
    stdin_open: true
    tty: true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Network configuration
    networks:
      - agent-network

    # Security options
    security_opt:
      - no-new-privileges:true

    # Restart policy
    restart: unless-stopped

  # Optional: Redis for task queue (for future multi-agent support)
  redis:
    image: redis:7-alpine
    container_name: defender-redis
    hostname: defender-redis

    volumes:
      - redis-data:/data

    networks:
      - agent-network

    restart: unless-stopped

    profiles:
      - with-queue

volumes:
  repo-workspace:
    driver: local
  git-credentials:
    driver: local
  azure-config:
    driver: local
  redis-data:
    driver: local

networks:
  agent-network:
    driver: bridge
